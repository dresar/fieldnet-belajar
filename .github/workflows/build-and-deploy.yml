name: Build APK and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-release-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Run Content & Schema Validation
        run: npm test

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./FieldNet-Belajar-v1.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldNet-Belajar-Android-APK
          path: ./FieldNet-Belajar-v1.0.0.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "FieldNet Belajar v1.0.0 (Android APK)"
          draft: false
          prerelease: false
          files: ./FieldNet-Belajar-v1.0.0.apk
          body: |
            ### 📱 FieldNet Belajar - APK Android Offline-First
            
            Aplikasi mobile belajar teknisi jaringan dan CCTV lapangan yang berjalan 100% tanpa internet.

            #### 📥 Download Langsung APK:
            - **Nama Berkas:** `FieldNet-Belajar-v1.0.0.apk`
            - **Platform:** Android 7.0+ (Nougat ke atas)
            - **Cara Pasang:**
              1. Unduh berkas `FieldNet-Belajar-v1.0.0.apk`.
              2. Buka di smartphone Android dan pilih *Install* (Izinkan pemasangan dari sumber ini jika diminta).
              3. Aplikasi langsung dapat digunakan tanpa koneksi internet!

  deploy-pages:
    name: Deploy Web App to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-release-apk
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
